# TEMPLATE ONLY: all zero coordinates are placeholders, not safe poses.
calibrated: false
arm_units: mm   # Robot converts mm to the plaintext SDK's cm.
observe_pose: {arm: {x: 0, y: 0}}
grab_pose: {arm: {x: 0, y: 0}}  # Same scripted grip after image alignment.
# Coarse dead-reckoning from observe toward each tag; [] means already near it.
# Translation only, fixed heading. Successful picks retrace these + visual steps
# before the existing observe -> conveyor route. Never retreat automatically on error.
coarse_routes:
  0: []
  1: []
  2: []
visual_approach:
  taught: false  # Confirm a graspable image setpoint and both motion signs locally.
  frame_width: 640
  frame_height: 360
  target_u_px: 320  # Teach at an actual graspable pose, not necessarily image center.
  target_v_px: 180  # Vertical alignment is a gate, not an independent chassis DOF.
  target_side_px: 80  # Mean tag edge length in pixels; TEMPLATE, not a distance.
  u_tolerance_px: 8
  v_tolerance_px: 12
  size_tolerance_px: 5
  min_side_px: 12
  max_side_px: 120
  edge_margin_px: 8
  max_edge_ratio: 1.5  # Reject severe skew; not an orientation/pose estimate.
  forward_sign: 1  # Too small -> this sign of chassis X; verify on your mounting.
  lateral_sign: 1  # Tag right of target -> this sign of chassis Y; verify.
  forward_step_m: 0.01
  lateral_step_m: 0.01
  speed_mps: 0.05
  settle_s: 0.15
  max_travel_m: 0.30
  max_steps: 40
  stable_frames: 3
  max_frame_age_s: 0.4
  timeout_s: 45
  min_improvement_px: 0.5
  max_stalled_steps: 3
conveyor_wp: {chassis: {x_m: 0, y_m: 0, z_deg: 0}}
drop_pose: {arm: {x: 0, y: 0}}
home_wp: {chassis: {x_m: 0, y_m: 0, z_deg: 0}}
gripper_level: 1
# Tune these dwell times on hardware; ok is not independent physical verification.
arm_settle_s: 2
gripper_settle_s: 1
chassis_settle_s: 1
chassis_speed_mps: 0.1
chassis_speed_dps: 15
advance_seconds: 3
