# Copy to config.local.yaml; never place API keys here.
pi: {base_url: "http://<CONFIRM_PI_IP>:8081"}
baseten:
  url: "https://inference.baseten.co/v1"
  model: null  # Or BASETEN_VISION_MODEL from the live catalog.
  command_model: null  # Or BASETEN_COMMAND_MODEL; separate, optional language-command client.
  api_key_env: BASETEN_API_KEY
tag_map: tag_map.yaml
node_token_env: HCP_NODE_TOKEN
command_mode: baseten  # demo must be explicitly selected; never a fallback after model failure.
