<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schematic to Fetch</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">BENCH / P0</p>
    <h1>Schematic to Fetch</h1>
    <p class="intro">Choose a circuit. Collect its parts.</p>
    <p id="mode" role="status">Connecting to the bench…</p>
    <section aria-label="Connected hardware">
      <div id="nodes" class="nodes"></div>
    </section>
    <form id="run-form">
      <label for="pdf">Schematic PDF</label>
      <input id="pdf" name="pdf" type="file" accept="application/pdf,.pdf">
      <p id="demo-note" hidden>Leave empty to run the five-part simulation fixture. <a href="/demo.pdf">View fixture</a></p>
      <button id="run-button" type="submit" disabled>Run</button>
    </form>
    <section id="progress" aria-live="polite">
      <h2 id="state">Ready when the bench is connected</h2>
      <p id="step">Arm, conveyor, and camera are required.</p>
      <progress id="count" value="0" max="1" aria-label="Delivered quantities"></progress>
      <p id="quantities"></p>
      <p id="error" role="alert"></p>
      <ul id="warnings"></ul>
      <ol id="delivered"></ol>
    </section>
  </main>
</body>
</html>
